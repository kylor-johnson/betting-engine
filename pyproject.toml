[project]
name = "engine"
version = "0.1.0"
description = "Personal betting engine: price checks, line logging, bet audit"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.0", "pyyaml>=6.0"]

[project.scripts]
engine = "engine.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
