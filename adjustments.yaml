# Sourced news for upcoming games (decision 0029). Each entry moves the playbook's number for its game, but only by the part
# Pinnacle has not moved for since `news_at`; with no `news_at`, or no Pinnacle line stored from before it, the entry counts for nothing.
# `points` is the FULL effect of the news: how much BETTER (+) or WORSE (-) that team is for a spread entry, or points to add (+) or
# remove (-) from the total. Do not net out what the market already did; the engine does that.
# `game` and `team` must be written exactly as Wagerhouse names them ("Away at Home"); `uv run engine news` lists any entry that matches
# no game. Sizes per sport: ops/agent_prompt_<sport>.md. Remove an entry once the game is played.
adjustments:
  - game: "Denver Broncos at Pittsburgh Steelers"
    team: "Pittsburgh Steelers"
    market: spread
    points: -2.5
    reason: "Mason Rudolph will start Friday against Denver in place of Aaron Rodgers (Tom Pelissero, Rotoworld relay via ESPN feed, Nov 24 21:25 MT); Rodgers was not at the facility Wednesday morning (Jordan Schultz, Nov 25 07:20 MT). Usual starter out, sized at the measured 2.5."
    source: "https://www.espn.com/nfl/injuries"
    added: "2026-11-25 08:04 MT"
    news_at: "2026-11-24 21:25 MT"
