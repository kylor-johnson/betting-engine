# Adjustments to the model's number for this week's games. Nothing else moves the fair line.
# Each entry needs every field. `points` is how much BETTER (+) or WORSE (-) that team is than
# its rating for a spread entry, or how many points to add (+) or remove (-) from the total.
# Remove an entry once the game is played.
#
# Quarterback guide (starter against that team's backup): elite 6 to 7, good 4 to 5,
# average 2 to 3, low 0 to 1.5. Count only the part the ratings have not absorbed yet:
# the ratings move about 10% a week, so a change two or three games old is partly in.
adjustments:
  - game: "Arizona Cardinals at Kansas City Chiefs"
    team: "Arizona Cardinals"
    market: spread
    points: -4.5
    reason: "Third quarterback of the month: Minshew to injured reserve Nov 18, Beck ruled out Nov 21, Josh Johnson expected to start. None of this is in the ratings."
    source: "https://www.espn.com/nfl/injuries"
    added: "2026-11-21 16:33 MT"
  - game: "Pittsburgh Steelers at Philadelphia Eagles"
    team: "Philadelphia Eagles"
    market: spread
    points: -2.0
    reason: "Jalen Hurts not playing; Joe Milton confirmed as starter Nov 18. Two games without Hurts are partly in the ratings, so only the rest is counted."
    source: "https://www.espn.com/nfl/injuries"
    added: "2026-11-21 16:33 MT"
  - game: "Baltimore Ravens at Carolina Panthers"
    team: "Baltimore Ravens"
    market: spread
    points: -3.0
    reason: "Lamar Jackson on injured reserve (thumb), possible return Week 16. Recent games without him are partly in the ratings, so only the rest is counted."
    source: "https://www.espn.com/nfl/injuries"
    added: "2026-11-21 16:33 MT"
  - game: "Minnesota Vikings at San Francisco 49ers"
    team: "Minnesota Vikings"
    market: spread
    points: -1.5
    reason: "Kyler Murray ruled out Nov 20 (hamstring); Kirk Cousins starts. Cousins started and won last week, so part of this is already in the ratings."
    source: "https://www.espn.com/nfl/injuries"
    added: "2026-11-21 16:33 MT"
