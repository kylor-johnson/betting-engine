# `points` is the FULL effect of the news: how much BETTER (+) or WORSE (-) that team is for a spread entry, or points to add (+) or
# remove (-) from the total. Do not net out what the market already did; the engine does that.
# `game` and `team` must be written exactly as Wagerhouse names them ("Away at Home"); `uv run engine news` lists any entry that matches
# no game. Sizes per sport: ops/agent_prompt_<sport>.md. Remove an entry once the game is played.
