# The agent's decisions for this card. Status and reasons only: every number on the
# card comes from the slate sheet. A Bet the numbers do not support is refused.
slate_note: >
  Scheduled morning run. Three sides are flagged (Syracuse, Kentucky, Washington State) and all three are Passes:
  each is a half-point or juice gap with no news behind it, and fresh searches found no current quarterback news
  for Kentucky, Louisville, Washington State or San Diego State. Of the four playbook CHECK rows, Clemson's price is
