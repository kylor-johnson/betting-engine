  are held. No college adjustments were added.
decisions:
  - game: "Notre Dame Fighting Irish at Syracuse Orange"
    market: spread
    side: home
    status: Pass
    why_pass: >
      The only news here hurts Syracuse: starting quarterback Steve Angeli is ruled out with a shoulder injury
      (ESPN, Nov 23), and backup Malachi Nelson also left Saturday's game hurt. Pinnacle has since gone a half point
      toward Notre Dame and charges extra juice on Syracuse, so the book's extra half point is a price gap, not a
      reason, and the news that exists points the other way.
  - game: "San Diego State Aztecs at Washington State Cougars"
    market: spread
    side: home
    status: Pass
    why_pass: >
      Pinnacle has Washington State a half point higher than the book, and the line has risen from its open. I
      searched again for either team's quarterback status for this game and found only 2024 and 2025 items. A price
      gap with no news behind it is not a reason.
  - game: "Louisville Cardinals at Kentucky Wildcats"
    market: spread
    side: home
    status: Pass
    why_pass: >
      The edge comes only from the book dealing Kentucky +3 at standard juice while Pinnacle charges more at the
      same number. That is a price gap, not a reason. I searched again for Louisville or Kentucky quarterback news
      this week; every result was from an earlier season. This would change with a sourced Louisville quarterback
      injury the market has not followed.
  - game: "North Dakota State Bison at San José State Spartans"
    market: total
    side: over
    status: Pass
    why_pass: >
      No longer flagged. Yesterday I found no injury, weather or quarterback news for either team, and the total had
      risen from its open for reasons I could not see. A price gap I cannot explain is a Pass.
  - game: "USC Trojans at UCLA Bruins"
    market: spread
    side: home
    status: Pass
    why_pass: >
      Not flagged. Pinnacle deals UCLA +7 at standard juice, so yesterday's juice gap is gone. I found no new report
