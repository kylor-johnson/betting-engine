    why: >
      I looked for Rutgers and Michigan State quarterback news. The latest dated item I could open says Rutgers starter
      Dylan Lonergan was out after a blow to the head and AJ Surace started against Michigan (ClutchPoints, Oct 31). I
      found no current report on Lonergan or on Michigan State's quarterbacks; the Michigan State page would not load.
      Nothing I found says the market is wrong.
    source: "https://clutchpoints.com/ncaa-football/rutgers-football-news-aj-surace-starting-qb-michigan-benching"
