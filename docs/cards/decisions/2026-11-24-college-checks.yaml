checks:
  - key: "401856764|side|home"
    verdict: hold
    why: >
      The market knows what the points-based model cannot see. Clemson's starting quarterback Tait Reynolds tore his left
      meniscus against Georgia Tech on Nov 14 and is out for the season (WCSC Live5, Nov 15, 3:51 PM ET). Christopher
      Vizzina left that game with a concussion and was already playing through an injury, and senior Trent Pearman was
      next in line. Clemson's points so far were scored mostly with a quarterback who will not play, so a home underdog
      price with a third-string-level room is what you would expect.
    source: "https://www.live5news.com/2026/11/15/clemson-qb-tait-reynolds-miss-rest-season/?outputType=amp"
  - key: "401858542|side|home"
