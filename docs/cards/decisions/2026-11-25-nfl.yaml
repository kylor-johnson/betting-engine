# The agent's decisions for this card. Status and reasons only: every number on the
# card comes from the slate sheet. A Bet the numbers do not support is refused.
slate_note: >
  Stale-number run (16:52 MT), started by Rams -2.5 at a better price than Pinnacle's. The only fresh news is tonight's
  inactives (Yahoo Sports, Nov 25 16:51 MT): Green Bay's Josh Jacobs is out, as expected after a limited week, and
  Micah Parsons is active for his season debut. Those pull opposite ways, neither is a quarterback, and it is a juice
  gap, not a line gap, so it is a Pass. Also since 13:00: Pittsburgh waived Aaron Rodgers (ESPN feed, 14:48 MT), which
  confirms the Rudolph entry; Justin Herbert (concussion) did not practice (Noah Furtado, The Athletic, 13:27 MT) and
  stays Questionable; Arizona says Carson Beck's back injury puts Josh Johnson in line to start.
decisions:
  - game: "Kansas City Chiefs at Buffalo Bills"
    market: total
    side: under
    status: Conditional
    summary: >
      The wind model's pick: Thursday night's Buffalo forecast is about 20 mph wind with cold and heavy rain, and the
      model takes points off the total even after Wagerhouse moved a half point below Pinnacle.
    condition: "Forecast still at or above 20 mph two hours before kickoff."
    reasons:
      price: >
        Wagerhouse has moved below Pinnacle's total, and the wind model still takes enough off Pinnacle's no-vig
        number for the Under to clear; the sheet holds the figures.
      matchup: >
        Context only. Buffalo's defense is #1 in EPA per play and points per drive over the last four games,
        against offenses ranked #28 in toughness, after #30 in the six games before. Kansas City is +8 in
        turnover margin with 67% of fumbles recovered, which flatters its points. The efficiency total is
        above the market and is not a reason.
      situation: >
        Thanksgiving night in Buffalo, open air; the Open-Meteo forecast about 25 hours out is 20.6 mph wind with
        heavy rain. The tested wind model is the reason: Unders went 321-221 on held-out seasons since 2019 but
        only 75-63 since 2024 (research 14).
      priced_in: >
        DraftKings opened this total at 50.5 and it is 46.5 now, matching Pinnacle, and Wagerhouse is lower still,
        so the market has already taken four or more points off, much of which is likely the same wind forecast.
        The model's points are added to Pinnacle's current number, so part of the edge may be priced; that is why
        it stays a Conditional.
      kills_it: >
        The forecast drops below the condition, the game is moved or delayed, or Wagerhouse drops further before
        the condition can be checked.
  - game: "Green Bay Packers at Los Angeles Rams"
    market: spread
    side: home
    status: Pass
    why_pass: >
      This side set off the stale alert. Wagerhouse deals Rams -2.5 at -110 where Pinnacle charges -113. That is a
      juice gap on the same number, and a price gap alone is never a reason. I looked for news Pinnacle has and
      Wagerhouse lacks and found only the inactives (Yahoo Sports, 16:51 MT): Jacobs out was expected, Parsons
      active helps Green Bay, and both are public an hour before kickoff.
  - game: "Denver Broncos at Pittsburgh Steelers"
    market: spread
    side: away
    status: Pass
    why_pass: >
      Flagged only by the unpriced part of my own Rudolph entry. Pinnacle moved a point for Rudolph starting
      (Pelissero, Nov 24 21:25 MT) and held there after Pittsburgh waived Rodgers (ESPN feed, Nov 25 14:48 MT).
      Wagerhouse is already a half point past Pinnacle. I have nothing sourced that says the market's one point is
      too small.
  - game: "Atlanta Falcons at Minnesota Vikings"
    market: spread
    side: away
    status: Pass
    why_pass: >
      Kept; not flagged. Kyler Murray (hamstring) was limited in Wednesday's walkthrough (ESPN feed, Nov 25 16:01 MT)
      and is still Questionable. Kirk Cousins started the last two games, and nothing says Murray will start.
  - game: "Baltimore Ravens at Houston Texans"
    market: spread
    side: home
    status: Pass
    why_pass: >
      Not flagged. Lamar Jackson has been out since Nov 1 and the market has priced Brissett for weeks. It would
      change only with news the market has not priced, such as a Stroud or Brissett injury.
  - game: "Seattle Seahawks at San Francisco 49ers"
    market: spread
    side: away
    status: Pass
    why_pass: >
      Not flagged; recorded for the Purdy news. He did not practice Wednesday with an ankle injury (Vic Tafur, The
      Athletic, ESPN feed Nov 25 12:57 MT) and is Questionable, not ruled out. Darnold is expected to start for
      Seattle if Wednesday's practice goes well. A Seattle side would rest on my own guess at the chance Purdy sits.
