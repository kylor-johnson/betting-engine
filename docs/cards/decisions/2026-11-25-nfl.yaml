# The agent's decisions for this card. Status and reasons only: every number on the
# card comes from the slate sheet. A Bet the numbers do not support is refused.
slate_note: >
  Quarterback-news run (13:04 MT). Brock Purdy has a low ankle sprain from Sunday's win, will not practice Wednesday
  and is day to day; Kyle Shanahan said missing Seattle is "always a possibility" (Niners Wire and The Big Lead on
  Yahoo, first at Nov 25 12:33 MT). He is Questionable, not ruled out, and Sam Darnold is also Questionable for Seattle,
  so I added no entry: the size of a chance he sits is my own estimate, and Pinnacle is already at San Francisco -2.5
  from a -3 open. Arizona says Josh Johnson is preparing to start for Carson Beck (Cardinals site, Nov 25 12:27 MT),
  which the market has priced since Johnson started Sunday; Rodgers confirmed on McAfee he is done as Pittsburgh's
  starter, which matches the existing Rudolph entry. Only the Buffalo wind Under is flagged; it stays a Conditional.
decisions:
  - game: "Kansas City Chiefs at Buffalo Bills"
    market: total
    side: under
    status: Conditional
    summary: >
      The wind model's pick: Thursday night's Buffalo forecast is about 20 mph wind with cold and heavy rain, and the
      model takes points off the total even after Wagerhouse moved a half point below Pinnacle.
    condition: "Forecast still at or above 20 mph two hours before kickoff."
    reasons:
      price: >
        Wagerhouse has moved below Pinnacle's total, and the wind model still takes enough off Pinnacle's no-vig
        number for the Under to clear; the sheet holds the figures.
      matchup: >
        Context only. Buffalo's defense is #1 in EPA per play and points per drive over the last four games,
        against offenses ranked #28 in toughness, after #30 in the six games before. Kansas City is +8 in
        turnover margin with 67% of fumbles recovered, which flatters its points. The efficiency total is
        above the market and is not a reason.
      situation: >
        Thanksgiving night in Buffalo, open air; the Open-Meteo forecast about 29 hours out has stronger wind and
        more rain than this morning's. The tested wind model is the reason: Unders went 321-221 on held-out seasons
        since 2019 but only 75-63 since 2024 (research 14).
      priced_in: >
        DraftKings opened this total at 50.5 and it is 46.5 now, matching Pinnacle, and Wagerhouse is lower still,
        so the market has already taken four or more points off, much of which is likely the same wind forecast.
        The model's points are added to Pinnacle's current number, so part of the edge may be priced; that is why
        it stays a Conditional.
      kills_it: >
        The forecast drops below the condition, the game is moved or delayed, or Wagerhouse drops further before
        the condition can be checked.
  - game: "Denver Broncos at Pittsburgh Steelers"
    market: spread
    side: away
    status: Pass
    why_pass: >
      Kept from this morning; not flagged now. Rudolph starting (Pelissero, Nov 24 21:25 MT) is public, Pinnacle
      moved a full point for it and Wagerhouse followed. Rodgers said on McAfee Wednesday he does not plan to
      remain with the team, which confirms the entry rather than adding new news.
  - game: "Atlanta Falcons at Minnesota Vikings"
    market: spread
    side: away
    status: Pass
    why_pass: >
      Kept from Nov 24; not flagged. Kyler Murray is Questionable (ESPN feed Nov 24 05:39 MT, no note) and Kirk
      Cousins started the last two games; nothing says Murray will start.
  - game: "Baltimore Ravens at Houston Texans"
    market: spread
    side: home
    status: Pass
    why_pass: >
      Not flagged. The Lamar Jackson absence dates from Nov 1 and the market has priced Brissett for weeks. It
      would change only with news the market has not priced, such as a Stroud or Brissett injury.
  - game: "Seattle Seahawks at San Francisco 49ers"
    market: spread
    side: away
    status: Pass
    why_pass: >
      Not flagged; recorded for the Purdy news. He is Questionable with a low ankle sprain and day to day (Shanahan
      via Niners Wire, Nov 25 12:33 MT), not ruled out, and Seattle's Darnold is Questionable too. Pinnacle is
      already off the -3 open. A Seattle side would rest on my own guess at the chance he sits. It changes if
      Purdy is ruled out or doubtful and Wagerhouse has not followed Pinnacle.
