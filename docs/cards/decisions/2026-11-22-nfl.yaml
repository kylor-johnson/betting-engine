# The agent's decisions for this card. Status and reasons only: every number on the
# card comes from the slate sheet. A Bet the numbers do not support is refused.
slate_note: >
  Sample card, built Saturday evening for Sunday's games. By this point in the week the
  market has had six days to settle, which is when value is hardest to find. The numbers
  flagged three sides; none has a reason that is not already in the price.
decisions:
  - game: "New Orleans Saints at Chicago Bears"
    market: spread
    side: away
    status: Pass
    why_pass: >
      The only thing on the Saints' side is the slow market rating (Bears by 5). About 50 public
      systems say Bears by 10, which is the market. The line moved 5 points this week and I found
      no injury that explains it, so I cannot say the move is wrong. No reason beyond the number.
  - game: "Tennessee Titans at Dallas Cowboys"
    market: spread
    side: home
    status: Pass
    why_pass: >
      A thin edge (under a point) that means laying the half point above 7, the wrong side of a
      key number. Nothing found on injuries or matchup that the price is missing.
  - game: "Baltimore Ravens at Carolina Panthers"
    market: spread
    side: home
    status: Pass
    why_pass: >
      The edge exists only because of my own 3-point estimate for Lamar Jackson's absence.
      Without that estimate the model and Pinnacle both make it Panthers by about 3, which is
      your book's number. An estimate is not a reason to bet.
