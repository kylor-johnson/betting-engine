# The agent's decisions for this card. Status and reasons only: every number on the
# card comes from the slate sheet. A Bet the numbers do not support is refused.
slate_note: >
  This run was started by a stale-number alert. The only fresh news I found is on USC at UCLA. ESPN
  published at 2026-11-23 09:08 MT that UCLA quarterback Ty Dieffenbach's hip injury, from Saturday's
  triple-overtime loss at Michigan, is "a little bit better than we thought" (clean X-rays, not ruled
  out). Pinnacle now charges extra juice on UCLA +7, and Wagerhouse still deals it at standard juice.
  Dieffenbach has no official status, so UCLA is a Conditional. For San Diego State at Washington State
  (Pinnacle Wazzu -3, Wagerhouse -2.5) I found no news, so it is a Pass. Kentucky is still a Pass.
decisions:
  - game: "USC Trojans at UCLA Bruins"
    market: spread
    side: home
    status: Conditional
    condition: "Ty Dieffenbach is confirmed as UCLA's starting quarterback against USC."
    summary: >
      UCLA's starting quarterback was hurt Saturday but is reported better than feared. If he is
      confirmed to start, the market should move toward UCLA. The book has not followed Pinnacle's
      shift on UCLA.
    reasons:
      price: >
        Pinnacle charges extra juice on UCLA at the same number the book deals at standard juice.
        On its own that is a price gap, not a reason. It counts only with the quarterback news behind it.
      matchup: >
        Context only. Dieffenbach has started since Nico Iamaleava tore his ACL on Oct 10. If he cannot
        go, Madden Iamaleava, a third-stringer, is expected to start (Yahoo, 2026-11-23 14:16 MT), which
        would be a big drop.
      situation: >
        ESPN reported at 09:08 MT Monday that the hip injury is minor, X-rays were clean, and he is not
        ruled out. Chesney said "there's a chance" he plays and "we'll know more as the week goes on."
        It is a rivalry game.
      kills_it: >
        Dieffenbach is ruled out or limited and Madden Iamaleava starts. The market moves to UCLA before
        the confirmation, so the book's number is no longer better than Pinnacle's.
  - game: "San Diego State Aztecs at Washington State Cougars"
    market: spread
    side: home
    status: Pass
    why_pass: >
      Pinnacle has Washington State a half point higher than the book, and DraftKings has moved from
      its open toward Washington State. I looked for news to explain the move and found none. I found
      no current quarterback report for either team. The only San Diego State quarterback news I found
      was Jayden Denegal's ankle injury from October, which was before these teams met on Oct 31.
      Washington State's Owen Eshelman has no injury report I could find. A price gap with no news
      behind it is not a reason. This would change with a sourced, timestamped San Diego State
      quarterback absence that the book has not priced.
  - game: "Louisville Cardinals at Kentucky Wildcats"
    market: spread
    side: home
    status: Pass
    why_pass: >
      The edge comes only from the book dealing Kentucky at standard juice while Pinnacle charges more
      at the same number. That is a price gap, not a reason. The line moved from Kentucky favored at the
      open to Kentucky as an underdog, and the move has a plain explanation in form: Kentucky has lost
      three straight, and Louisville has won six straight. I searched again this afternoon and found no
      2026 quarterback injury news for either team. Every result was from an earlier season. This would
      change with a sourced Louisville quarterback injury that the market has not followed.
  - game: "Jacksonville State Gamecocks at Delaware Blue Hens"
    market: spread
    side: home
    status: Pass
    why_pass: >
      This side is no longer flagged on the current sheet. When it was, the edge came only from Pinnacle
      charging more juice at the same number. I found no 2026 quarterback news for either team. This
      would change with a sourced Jacksonville State quarterback injury that the market has not followed.
